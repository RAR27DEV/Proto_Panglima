<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Panglima - Sistem Pencatatan Toko Bangunan</title>
  <meta name="description" content="Sistem pencatatan keuangan Toko Panglima Bangunan – mudah, sederhana, dan terstruktur." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon"><span class="material-symbols-outlined">architecture</span></div>
        <div class="logo-text">
          <span class="logo-name">Toko Panglima</span>
          <span class="logo-sub">Bangunan</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Utama</div>
      <a class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon"><span class="material-symbols-outlined">dashboard</span></span>
        <span>Dashboard</span>
      </a>

      <div class="nav-section-label collapsible" onclick="toggleSubmenu('submenu-toko')">
        <span>Toko Utama</span>
        <span class="chevron" id="chevron-toko">▼</span>
      </div>
      <div class="submenu" id="submenu-toko">
        <a class="nav-item" data-page="barang-masuk" id="nav-barang-masuk">
          <span class="nav-icon"><span class="material-symbols-outlined">inventory_2</span></span>
          <span>Barang Masuk</span>
        </a>
        <a class="nav-item" data-page="utang" id="nav-utang">
          <span class="nav-icon"><span class="material-symbols-outlined">assignment</span></span>
          <span>Utang</span>
        </a>
        <a class="nav-item" data-page="piutang" id="nav-piutang">
          <span class="nav-icon"><span class="material-symbols-outlined">credit_card</span></span>
          <span>Piutang</span>
        </a>
        <a class="nav-item" data-page="uang-keluar" id="nav-uang-keluar">
          <span class="nav-icon"><span class="material-symbols-outlined">payments</span></span>
          <span>Uang Keluar</span>
        </a>
      </div>

      <div id="dynamic-rute-sidebar">
        <!-- Rute Luar Kota will be rendered here dynamically -->
      </div>

      <div class="nav-section-label">Laporan &amp; Pengaturan</div>
      <a class="nav-item" data-page="stok-toko" id="nav-stok-toko">
        <span class="nav-icon"><span class="material-symbols-outlined">shelves</span></span>
        <span>Stok Toko</span>
      </a>
      <a class="nav-item" data-page="laporan-keuangan" id="nav-laporan-keuangan">
        <span class="nav-icon"><span class="material-symbols-outlined">analytics</span></span>
        <span>Laporan Keuangan</span>
      </a>
      <a class="nav-item" data-page="pengaturan-rute" id="nav-pengaturan-rute">
        <span class="nav-icon"><span class="material-symbols-outlined">map</span></span>
        <span>Manajemen Rute</span>
      </a>
    </nav>
    
    <script>
      function toggleSubmenu(id) {
        const el = document.getElementById(id);
        const chev = document.getElementById(id.replace('submenu', 'chevron'));
        if (el.classList.contains('open')) {
          el.classList.remove('open');
          if (chev) chev.classList.remove('open');
        } else {
          el.classList.add('open');
          if (chev) chev.classList.add('open');
        }
      }
      
      // Auto-open submenu if it contains the active menu
      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          document.querySelectorAll('.submenu').forEach(sub => {
            if(sub.querySelector('.nav-item.active')) {
              sub.classList.add('open');
              const chev = document.getElementById(sub.id.replace('submenu', 'chevron'));
              if(chev) chev.classList.add('open');
            }
          });
        }, 100);
      });
    </script>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Buka menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <button class="btn-back no-print" id="btn-global-back" title="Kembali ke halaman sebelumnya" disabled>
        <span class="material-symbols-outlined" style="font-size:17px">arrow_back</span>Kembali
      </button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-right">
        <div class="date-display" id="date-display"></div>
        <div class="user-badge" title="Admin Toko">
          <span class="material-symbols-outlined" style="font-size:19px">person</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content" id="content">
      <!-- Pages are rendered here by JS -->
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Tambah Data</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
